name: Shared site visual checks
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'packages/site-ui/**'
      - 'src/**'
      - 'scripts/**'
      - 'tests/site-ui.test.mjs'
      - 'package*.json'
      - '.github/workflows/site-ui-visual.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: homepage
      - uses: actions/checkout@v4
        with:
          repository: czNail/my-blog
          path: my-blog
      - uses: actions/checkout@v4
        with:
          repository: czNail/totp
          path: totp
      - uses: actions/checkout@v4
        with:
          repository: czNail/portfolio-pilot
          path: portfolio-pilot
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Use the current shared source in all consumers
        run: |
          for app in my-blog totp portfolio-pilot; do
            (cd "$app" && node scripts/sync-site-ui.mjs --from ../homepage)
          done
      - name: Build all four sites
        run: |
          cd homepage
          npm ci
          npm test
          npm run check
          npm run build
          cd ../my-blog
          pnpm install --frozen-lockfile
          pnpm run build
          cd ../totp
          npm ci
          npm test
          npm run build
          cd ../portfolio-pilot
          npm ci
          npm test
          npm run build
      - run: npx playwright install --with-deps chromium
        working-directory: homepage
      - run: npm run test:visual
        working-directory: homepage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-site-screenshots
          path: homepage/artifacts/site-ui
